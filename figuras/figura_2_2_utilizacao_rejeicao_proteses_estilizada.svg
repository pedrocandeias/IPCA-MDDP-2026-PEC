<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Utilização e rejeição de próteses do membro superior adquiridas</title>
  <desc id="desc">Árvore com 224 inquéritos respondidos, separando ausência de utilização, uso primário, rejeição e uso continuado.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#59636d"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#b5453c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .outline { stroke: #59636d; stroke-width: 3; }
      .arrow { fill: none; stroke: #59636d; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-both { fill: none; stroke: #59636d; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #59636d; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow); }
      .red-dashed { fill: none; stroke: #b5453c; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<rect x="630" y="40" width="360" height="230" rx="18" fill="#dce9f6" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="27" font-weight="700" fill="#1f2933"><tspan x="810" y="147.18">Inquéritos respondidos</tspan><tspan x="810" y="181.18">n = 224</tspan></text>
<rect x="230" y="350" width="360" height="230" rx="18" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="27" font-weight="600" fill="#1f2933"><tspan x="410" y="440.18">Nunca utilizou uma prótese</tspan><tspan x="410" y="474.18">n = 15</tspan><tspan x="410" y="508.18">6,7%</tspan></text>
<rect x="1030" y="350" width="360" height="230" rx="18" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="27" font-weight="600" fill="#1f2933"><tspan x="1210" y="440.18">Uso primário de prótese</tspan><tspan x="1210" y="474.18">n = 209</tspan><tspan x="1210" y="508.18">93,3%</tspan></text>
<rect x="20" y="750" width="360" height="230" rx="18" fill="#e8e1f2" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="24" font-weight="600" fill="#1f2933"><tspan x="200" y="844.16">Rejeição primária</tspan><tspan x="200" y="873.16">n = 10</tspan><tspan x="200" y="902.16">4,5% de 224</tspan></text>
<rect x="420" y="750" width="360" height="230" rx="18" fill="#f3ebdd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="24" font-weight="600" fill="#1f2933"><tspan x="600" y="815.16">A aguardar pela primeira</tspan><tspan x="600" y="844.16">prótese na data</tspan><tspan x="600" y="873.16">do inquérito</tspan><tspan x="600" y="902.16">n = 5</tspan><tspan x="600" y="931.16">2,2% de 224</tspan></text>
<rect x="820" y="750" width="360" height="230" rx="18" fill="#e8e1f2" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="24" font-weight="600" fill="#1f2933"><tspan x="1000" y="815.16">Prótese secundária</tspan><tspan x="1000" y="844.16">rejeitada</tspan><tspan x="1000" y="873.16">n = 28</tspan><tspan x="1000" y="902.16">13,4% de 209</tspan><tspan x="1000" y="931.16">12,5% de 224</tspan></text>
<rect x="1220" y="750" width="360" height="230" rx="18" fill="#edf1df" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="24" font-weight="600" fill="#1f2933"><tspan x="1400" y="815.16">Uso continuado</tspan><tspan x="1400" y="844.16">de prótese</tspan><tspan x="1400" y="873.16">n = 181</tspan><tspan x="1400" y="902.16">86,6% de 209</tspan><tspan x="1400" y="931.16">80,8% de 224</tspan></text>
<path d="M810 270 V310 H410 V350" class="arrow"/>
<path d="M810 270 V310 H1210 V350" class="arrow"/>
<path d="M410 580 V680 H200 V750" class="arrow"/>
<path d="M410 580 V680 H600 V750" class="arrow"/>
<path d="M1210 580 V680 H1000 V750" class="arrow"/>
<path d="M1210 580 V680 H1400 V750" class="arrow"/>
</svg>
