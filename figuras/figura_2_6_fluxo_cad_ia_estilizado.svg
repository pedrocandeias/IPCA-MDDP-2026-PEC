<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="950" viewBox="0 0 2200 950" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de CAD apoiado por inteligência artificial</title>
  <desc id="desc">Três painéis de entrada, processamento por IA e saída; os oito ícones da figura adaptada original são preservados.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6.0" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L12,6.0 L0,12 z" fill="#59636d"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6.0" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L12,6.0 L0,12 z" fill="#b5453c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .outline { stroke: #59636d; stroke-width: 3; }
      .arrow { fill: none; stroke: #59636d; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-both { fill: none; stroke: #59636d; stroke-width: 4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #59636d; stroke-width: 3.5; stroke-dasharray: 12 9; marker-end: url(#arrow); }
      .red-dashed { fill: none; stroke: #b5453c; stroke-width: 3.5; stroke-dasharray: 12 9; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<rect x="50" y="40" width="470" height="870" rx="20" fill="#f2f8f6" stroke="#59636d" stroke-width="3" />
<path d="M70 40 H500 Q520 40 520 60 V145 H50 V60 Q50 40 70 40 Z" fill="#ddefea"/>
<text text-anchor="middle" font-size="34" font-weight="700" fill="#1f2933"><tspan x="285.0" y="103.56">1 · Entrada</tspan></text>
<rect x="620" y="40" width="800" height="870" rx="20" fill="#f7f4fa" stroke="#59636d" stroke-width="3" />
<path d="M640 40 H1400 Q1420 40 1420 60 V145 H620 V60 Q620 40 640 40 Z" fill="#e8e1f2"/>
<text text-anchor="middle" font-size="34" font-weight="700" fill="#1f2933"><tspan x="1020.0" y="103.56">2 · Processamento por IA</tspan></text>
<rect x="1530" y="40" width="620" height="870" rx="20" fill="#fcf6f1" stroke="#59636d" stroke-width="3" />
<path d="M1550 40 H2130 Q2150 40 2150 60 V145 H1530 V60 Q1530 40 1550 40 Z" fill="#f8e7dd"/>
<text text-anchor="middle" font-size="34" font-weight="700" fill="#1f2933"><tspan x="1840.0" y="103.56">3 · Saída</tspan></text>
<line x1="80" y1="390" x2="490" y2="390" stroke="#59636d" stroke-width="2" opacity="0.35"/>
<line x1="80" y1="630" x2="490" y2="630" stroke="#59636d" stroke-width="2" opacity="0.35"/>

<image x="95" y="205.0" width="96.92307692307693" height="100.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933"><tspan x="300" y="247.2">Requisitos</tspan><tspan x="300" y="283.2">de projeto</tspan></text>
<image x="95" y="475.4639175257732" width="99.99999999999999" height="69.0721649484536" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933"><tspan x="300" y="520.2">Restrições</tspan></text>
<image x="95" y="715.0" width="74.6268656716418" height="100.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933"><tspan x="300" y="757.2">Propriedades</tspan><tspan x="300" y="793.2">do material</tspan></text>
<image x="675" y="214.0" width="68.63492063492063" height="92.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1040" y="251.86">Otimização por redes neuronais</tspan></text>
<text text-anchor="middle" font-size="22" font-weight="400" fill="#1f2933"><tspan x="1040" y="312.48">Multiobjetivo: peso, resistência e custo</tspan></text>
<line x1="660" y1="385" x2="1380" y2="385" stroke="#59636d" stroke-width="2" opacity="0.35"/>
<image x="675" y="464.0" width="67.02857142857142" height="92.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1040" y="519.86">Extração de características (CNN)</tspan></text>
<line x1="660" y1="635" x2="1380" y2="635" stroke="#59636d" stroke-width="2" opacity="0.35"/>
<image x="675" y="709.0" width="69.0" height="92.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1040" y="764.86">Arquitetura híbrida CNN–LSTM</tspan></text>
<image x="1580" y="214.0" width="66.44444444444444" height="92.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1885" y="252.36">33 modelos CAD</tspan><tspan x="1885" y="287.36">otimizados</tspan></text>
<line x1="1570" y1="385" x2="2110" y2="385" stroke="#59636d" stroke-width="2" opacity="0.35"/>
<image x="1580" y="464.0" width="53.76623376623377" height="92.0" href="data:image/png;base64,"/>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1885" y="502.36">Parâmetros de projeto</tspan><tspan x="1885" y="537.36">otimizados</tspan></text>
<line x1="1570" y1="635" x2="2110" y2="635" stroke="#59636d" stroke-width="2" opacity="0.35"/>
<text text-anchor="middle" font-size="70" font-weight="400" fill="#59636d"><tspan x="1625" y="778.8">↘</tspan></text>
<text text-anchor="middle" font-size="29" font-weight="700" fill="#1f2933"><tspan x="1885" y="747.36">Ciclos de projeto</tspan><tspan x="1885" y="782.36">reduzidos</tspan></text>
<path d="M520 475 H620" class="arrow"/>
<path d="M1420 440 H1530" class="arrow"/>
<path d="M1530 555 H1420" class="dashed"/>
<text text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933"><tspan x="1475" y="614.64">refinamento</tspan><tspan x="1475" y="639.64">iterativo</tspan></text>
</svg>
