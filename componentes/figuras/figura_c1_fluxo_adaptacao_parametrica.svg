<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de adaptação paramétrica dos modelos protésicos</title>
  <desc id="desc">Entradas e mapa comum alimentam regras de quatro modelos; seguem-se verificações, geometria intermédia e decisão de projeto.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#59636d"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#b5453c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .outline { stroke: #59636d; stroke-width: 3; }
      .arrow { fill: none; stroke: #59636d; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-both { fill: none; stroke: #59636d; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #59636d; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow); }
      .red-dashed { fill: none; stroke: #b5453c; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<text x="800" y="55" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2933">Da medida à variante geométrica: regras específicas de cada modelo</text>
<rect x="45" y="118" width="260" height="195" rx="18" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="175.0" y="168.5">Entradas</tspan></text>
<text x="75" y="206" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">• Medida individual</text>
<text x="75" y="240" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">• Referência populacional</text>
<text x="75" y="274" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">• Ajuste manual</text>
<text x="75" y="308" text-anchor="start" font-size="18" font-weight="400" fill="#1f2933">Unidade canónica: mm</text>
<rect x="382" y="118" width="330" height="195" rx="18" fill="#f3ebdd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="547.0" y="168.5">Mapa comum</tspan></text>
<text x="412" y="206" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">Nome anatómico comum</text>
<text x="412" y="240" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">Campo disponível no modelo</text>
<text x="412" y="274" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">Intervalo declarado</text>
<text x="412" y="308" text-anchor="start" font-size="18" font-weight="400" fill="#1f2933">Campos ausentes são omitidos</text>
<path d="M305 215 H382" class="arrow"/>
<rect x="790" y="90" width="340" height="135" rx="16" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="960" y="136.5">Flexy Beast</tspan></text>
<text text-anchor="middle" font-size="19" font-weight="400" fill="#1f2933"><tspan x="960" y="169.46">Palma: fórmula Cyborg Beast</tspan><tspan x="960" y="199.46">Dedos: proporções face ao médio</tspan></text>
<rect x="1195" y="90" width="340" height="135" rx="16" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="1365" y="136.5">Cyborg Beast</tspan></text>
<text text-anchor="middle" font-size="19" font-weight="400" fill="#1f2933"><tspan x="1365" y="169.46">Escala da palma e alavancas</tspan><tspan x="1365" y="199.46">Divisão proximal/distal calibrada</tspan></text>
<rect x="790" y="270" width="340" height="135" rx="16" fill="#e8e1f2" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="960" y="316.5">Paraglider Hand</tspan></text>
<text text-anchor="middle" font-size="19" font-weight="400" fill="#1f2933"><tspan x="960" y="349.46">Palma: escala uniforme</tspan><tspan x="960" y="379.46">Dedos: escalas próprias</tspan></text>
<rect x="1195" y="270" width="340" height="135" rx="16" fill="#dce9f6" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="1365" y="316.5">UnLimbited Phoenix</tspan></text>
<text text-anchor="middle" font-size="19" font-weight="400" fill="#1f2933"><tspan x="1365" y="349.46">Escala global com limite mínimo</tspan><tspan x="1365" y="379.46">Alongamento em zonas sem furos</tspan></text>
<path d="M712 157 H790" class="arrow"/>
<path d="M712 137 H740 V72 H1160 V157 H1195" class="arrow"/>
<path d="M712 283 H755 V337 H790" class="arrow"/>
<path d="M712 247 H1160 V337 H1195" class="arrow"/>
<rect x="285" y="505" width="430" height="165" rx="18" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="500.0" y="555.5">Verificações necessárias</tspan></text>
<text x="315" y="593" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">• limites e dependências internas</text>
<text x="315" y="627" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">• furos, folgas e interfaces mecânicas</text>
<text x="315" y="661" text-anchor="start" font-size="18" font-weight="400" fill="#1f2933">• comportamento fora da gama do modelo</text>
<rect x="865" y="505" width="450" height="165" rx="18" fill="#dce9f6" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="1090.0" y="555.5">Resultado intermédio</tspan></text>
<text x="895" y="593" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">Geometria OpenSCAD regenerada</text>
<text x="895" y="627" text-anchor="start" font-size="19" font-weight="400" fill="#1f2933">Malha STL/3MF mensurável</text>
<text x="895" y="661" text-anchor="start" font-size="18" font-weight="400" fill="#1f2933">Não equivale a ajuste anatómico validado</text>
<path d="M960 405 V455 H650 V505" class="arrow"/>
<path d="M1365 405 V455 H1200 V505" class="arrow"/>
<path d="M715 588 H865" class="arrow"/>
<rect x="360" y="760" width="880" height="100" rx="18" fill="#edf1df" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="25" font-weight="700" fill="#1f2933"><tspan x="800" y="800.5">Decisão de projeto</tspan></text>
<text text-anchor="middle" font-size="21" font-weight="400" fill="#1f2933"><tspan x="800" y="842.14">Aceitar, corrigir, limitar ou rejeitar a configuração antes do fabrico</tspan></text>
<path d="M1090 670 V715 H800 V760" class="arrow"/>
</svg>
