<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1085" viewBox="0 0 1600 1085" role="img" aria-labelledby="title desc">
  <title id="title">Comparação entre fluxos tradicional, CAD/CAM e de fabrico aditivo</title>
  <desc id="desc">Três sequências de produção distinguem etapas digitais, automatizadas e de trabalho manual.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#59636d"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12.5" refY="7.0" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7.0 L0,14 z" fill="#b5453c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
      .outline { stroke: #59636d; stroke-width: 3; }
      .arrow { fill: none; stroke: #59636d; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-both { fill: none; stroke: #59636d; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #59636d; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow); }
      .red-dashed { fill: none; stroke: #b5453c; stroke-width: 2.5; stroke-dasharray: 12 9; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<text x="40" y="55" text-anchor="start" font-size="32" font-weight="700" fill="#1f2933">Fluxo tradicional</text>
<rect x="40" y="80" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="152.5" y="137.48">Molde</tspan><tspan x="152.5" y="162.48">negativo</tspan></text>
<path d="M265 142 H295" class="arrow"/>
<rect x="295" y="80" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="407.5" y="137.48">Molde</tspan><tspan x="407.5" y="162.48">positivo</tspan></text>
<path d="M520 142 H550" class="arrow"/>
<rect x="550" y="80" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="662.5" y="137.48">Retificação</tspan><tspan x="662.5" y="162.48">manual do molde</tspan></text>
<path d="M775 142 H805" class="arrow"/>
<rect x="805" y="80" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="917.5" y="137.48">Fabrico manual</tspan><tspan x="917.5" y="162.48">por laminagem</tspan></text>
<path d="M1030 142 H1060" class="arrow"/>
<rect x="1060" y="80" width="225" height="125" rx="14" fill="#f3ebdd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="20" font-weight="600" fill="#1f2933"><tspan x="1172.5" y="126.3">Pós-processamento,</tspan><tspan x="1172.5" y="149.3">montagem</tspan><tspan x="1172.5" y="172.3">e alinhamento</tspan></text>
<path d="M1285 142 H1315" class="arrow"/>
<rect x="1315" y="80" width="225" height="125" rx="14" fill="#f3ebdd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="1427.5" y="137.48">Ajustes</tspan><tspan x="1427.5" y="162.48">finais</tspan></text>
<rect x="40" y="225" width="1500" height="48" rx="10" fill="#f8e7dd" stroke="#59636d" stroke-width="2.5" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="790.0" y="256.48">Trabalho manual</tspan></text>
<text x="40" y="350" text-anchor="start" font-size="32" font-weight="700" fill="#1f2933">Fluxo CAD/CAM</text>
<rect x="40" y="375" width="225" height="125" rx="14" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="152.5" y="444.98">Digitalização</tspan></text>
<path d="M265 437 H295" class="arrow"/>
<rect x="295" y="375" width="225" height="125" rx="14" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="407.5" y="432.48">Retificação</tspan><tspan x="407.5" y="457.48">virtual</tspan></text>
<path d="M520 437 H550" class="arrow"/>
<rect x="550" y="375" width="225" height="125" rx="14" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="662.5" y="444.98">Molde CNC</tspan></text>
<path d="M775 437 H805" class="arrow"/>
<rect x="805" y="375" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="917.5" y="432.48">Fabrico</tspan><tspan x="917.5" y="457.48">manual</tspan></text>
<path d="M1030 437 H1060" class="arrow"/>
<rect x="1060" y="375" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="20" font-weight="600" fill="#1f2933"><tspan x="1172.5" y="421.3">Pós-processamento,</tspan><tspan x="1172.5" y="444.3">montagem</tspan><tspan x="1172.5" y="467.3">e alinhamento</tspan></text>
<path d="M1285 437 H1315" class="arrow"/>
<rect x="1315" y="375" width="225" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="1427.5" y="432.48">Ajustes</tspan><tspan x="1427.5" y="457.48">finais</tspan></text>
<rect x="40" y="520" width="735" height="48" rx="10" fill="#ddefea" stroke="#59636d" stroke-width="2.5" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="407.5" y="551.48">Ambiente digital</tspan></text>
<rect x="805" y="520" width="735" height="48" rx="10" fill="#f8e7dd" stroke="#59636d" stroke-width="2.5" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="1172.5" y="551.48">Trabalho manual</tspan></text>
<text x="40" y="645" text-anchor="start" font-size="32" font-weight="700" fill="#1f2933">Fluxo de fabrico aditivo</text>
<rect x="40" y="670" width="280" height="125" rx="14" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="180.0" y="739.98">Digitalização</tspan></text>
<path d="M320 732 H350" class="arrow"/>
<rect x="350" y="670" width="280" height="125" rx="14" fill="#ddefea" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="490.0" y="727.48">Retificação</tspan><tspan x="490.0" y="752.48">virtual</tspan></text>
<path d="M630 732 H660" class="arrow"/>
<rect x="660" y="670" width="280" height="125" rx="14" fill="#e8e1f2" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="800.0" y="727.48">Produção automatizada</tspan><tspan x="800.0" y="752.48">por fabrico aditivo</tspan></text>
<path d="M940 732 H970" class="arrow"/>
<rect x="970" y="670" width="280" height="125" rx="14" fill="#f8e7dd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="20" font-weight="600" fill="#1f2933"><tspan x="1110.0" y="716.3">Pós-processamento,</tspan><tspan x="1110.0" y="739.3">montagem</tspan><tspan x="1110.0" y="762.3">e alinhamento</tspan></text>
<path d="M1250 732 H1280" class="arrow"/>
<rect x="1280" y="670" width="280" height="125" rx="14" fill="#f3ebdd" stroke="#59636d" stroke-width="3" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="1420.0" y="727.48">Ajustes</tspan><tspan x="1420.0" y="752.48">finais</tspan></text>
<rect x="40" y="815" width="900" height="48" rx="10" fill="#ddefea" stroke="#59636d" stroke-width="2.5" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="490.0" y="846.48">Ambiente digital e produção automatizada</tspan></text>
<rect x="970" y="815" width="590" height="48" rx="10" fill="#f8e7dd" stroke="#59636d" stroke-width="2.5" />
<text text-anchor="middle" font-size="22" font-weight="600" fill="#1f2933"><tspan x="1265.0" y="846.48">Trabalho manual</tspan></text>
</svg>
